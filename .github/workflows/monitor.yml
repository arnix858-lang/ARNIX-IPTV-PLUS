name: ARNIX IPTV monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: arnix-iptv-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check configured HLS streams
        run: python check_streams.py

      - name: Save diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: arnix-iptv-stream-status
          path: stream_status.json
          if-no-files-found: error
          retention-days: 14
