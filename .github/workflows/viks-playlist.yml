name: Viks TV playlist updater

on:
  push:
    branches: [main]
    paths:
      - 'viks_parser.py'
      - 'requirements.txt'
      - '.github/workflows/viks-playlist.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viks-playlist-update
  cancel-in-progress: true

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scan public Viks TV pages
        run: python viks_parser.py --once
      - name: Publish playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f playlist.m3u channels.json
          if git diff --cached --quiet; then
            echo 'No playlist changes.'
          else
            git commit -m 'Update Viks TV playlist'
            git push
          fi
