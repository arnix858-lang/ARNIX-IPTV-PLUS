name: Viks TV playlist updater

on:
  push:
    branches: [main]
    paths:
      - 'viks_parser.py'
      - 'viks_browser_probe.py'
      - 'requirements.txt'
      - '.github/workflows/viks-playlist.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viks-playlist-update
  cancel-in-progress: true

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Scan public Viks TV pages
        run: python viks_parser.py --once
      - name: Probe player network in Chromium
        continue-on-error: true
        env:
          VIKS_BROWSER_MAX_PAGES: '12'
          VIKS_BROWSER_WAIT_MS: '25000'
        run: python viks_browser_probe.py
      - name: Upload player diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viks-player-diagnostics
          path: |
            viks_debug.json
            viks_browser_debug.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f playlist.m3u channels.json
          if git diff --cached --quiet; then
            echo 'No playlist changes.'
          else
            git commit -m 'Update Viks TV playlist'
            git push
          fi
