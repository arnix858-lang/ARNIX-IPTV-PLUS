name: Build modified APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/original.apk"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Install Apktool
        run: |
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o apktool.jar
          printf '#!/usr/bin/env sh\nexec java -jar "$GITHUB_WORKSPACE/apktool.jar" "$@"\n' > apktool
          chmod +x apktool
          sudo mv apktool /usr/local/bin/apktool

      - name: Download authorized APK from GitHub Release
        run: |
          mkdir -p app
          curl -fL --retry 3 \
            "https://github.com/arnix858-lang/ARNIX-IPTV-PLUS/releases/download/V1.1/halva-tv-player-plus-dev_2.8.98.apk" \
            -o app/original.apk
          test -s app/original.apk
          file app/original.apk

      - name: Decode and rebrand
        run: |
          apktool d -f app/original.apk -o decoded
          python3 scripts/rebrand.py decoded

      - name: Rebuild APK
        run: |
          mkdir -p dist
          apktool b decoded -o dist/ARNIX-IPTV-Plus-unsigned.apk

      - name: Align and sign test APK
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          keytool -genkeypair -v -keystore arnix-test.jks -storepass android -keypass android \
            -alias arnix -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ARNIX IPTV Plus, OU=Development, O=ARNIX, L=Unknown, S=Unknown, C=US"
          "$BUILD_TOOLS/zipalign" -f -v 4 dist/ARNIX-IPTV-Plus-unsigned.apk dist/ARNIX-IPTV-Plus-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks arnix-test.jks --ks-pass pass:android \
            --key-pass pass:android --out dist/ARNIX-IPTV-Plus-test.apk dist/ARNIX-IPTV-Plus-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose dist/ARNIX-IPTV-Plus-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ARNIX-IPTV-Plus-test
          path: dist/ARNIX-IPTV-Plus-test.apk
          if-no-files-found: error
          retention-days: 14
