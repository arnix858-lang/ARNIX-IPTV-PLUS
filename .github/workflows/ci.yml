name: Validate playlist tools
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile build_playlist.py proxy_check.py
      - run: python build_playlist.py
      - run: git diff --exit-code -- playlist.m3u
